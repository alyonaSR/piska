# Резолвер тегов.
#
# ПОЧЕМУ ЭТО ОТДЕЛЬНЫЙ ФАЙЛ:
# код T6 на АВТ и на 24-2000 — РАЗНЫЕ физические величины.
# Единый плоский словарь кодов ломает систему молча.
# Ключ всегда 'установка:код'.
#
# ВНИМАНИЕ, ПРОВЕРЯТЬ: по 24-2000 столбец описаний в 'теги на хакатон.xlsx'
# похоже не выровнен со столбцом кодов. Проверено на данных:
#   242000:T18 подписан как "давление на выходе К-201",
#   но значения 50..100 (медиана 68.7) и корреляция 0.62
#   с лабораторной FlashPoint (медиана 68).
# То есть T18 — почти наверняка виртуальный анализатор вспышки.
# Все спорные коды помечены verified: false. Уточнить у организаторов.

units:
  AVT: "csv"          # data/avt_tags.csv
  "242000": "csv"     # data/242000_tags.csv

time_key: "date"
service_columns: ["Unnamed: 0", "Unnamed: 0.1"]
freq_min: 10

# Физический смысл тегов, которые реально используем.
# verified: true  — смысл подтверждён данными или схемой
# verified: false — взято из справочника, но данными НЕ подтверждено
catalog:
  "AVT:T33":
    desc: "Температура низа К-2"
    units: "degC"
    verified: true
  "AVT:F30":
    desc: "Расход фр.290-350 C с установки"
    units: "t/h"
    verified: true
  "AVT:F32":
    desc: "Расход фр.240-290 C с установки"
    units: "t/h"
    verified: true
  "AVT:F65":
    desc: "Производительность К-2 по отбензиненной нефти"
    units: "t/h"
    verified: true
  "AVT:T55":
    desc: "Температура на выходе из печи П-3"
    units: "degC"
    verified: true
  "AVT:P67":
    desc: "Давление верха К-2"
    units: "MPa"
    verified: true

  "242000:T5":
    desc: "Реактор Р-201, температура ГСС на выходе"
    units: "degC"
    verified: true
  "242000:T6":
    desc: "СПОРНО. Справочник: поточный анализатор серы. Данные: 348..391, похоже на температуру реактора."
    units: "degC?"
    verified: false
  "242000:T11":
    desc: "СПОРНО. Справочник: расход сырья массовый. Данные: медиана 363.6, похоже на температуру."
    units: "?"
    verified: false
  "242000:T18":
    desc: "СПОРНО. Похоже на ВА температуры вспышки ГОДТ (corr 0.62 с ЛИМС FlashPoint)."
    units: "degC"
    verified: false
  "242000:P13":
    desc: "Выход Р-202, качество по S"
    units: "ppm?"
    verified: false
  "242000:F26":
    desc: "Расход сырья на установку, объёмный"
    units: "m3/h"
    verified: true
  "242000:P24":
    desc: "Расход свежего ВСГ с КЦА"
    units: "?"
    verified: false

# Значения-маркеры, которые НЕ являются измерениями.
# Найдены в данных: у 8 колонок 24-2000 максимум ровно 307.00,
# у 3 колонок ровно 10.00. Одинаковый максимум у физически разных
# величин — это обрезка или служебное значение.
sentinel_values: [307.0, 10.0]
reject_negative_prefixes: ["F", "W", "Q"]   # расходы не бывают отрицательными
