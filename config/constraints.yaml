# Жёсткие ограничения и модельные диапазоны.
#
# ПРАВИЛО ГРАНИЦ ИЗ ТЗ: если для параметра нет подтверждённого рабочего
# диапазона, исторический min/max НЕЛЬЗЯ выдавать за промышленный предел.
# Каждый диапазон ниже помечен полем source:
#   spec       — требование спецификации, обсуждению не подлежит
#   assumption — наше модельное допущение для эксперимента

quality_specs:
  sulfur_mgkg:
    limit: 10.0
    direction: max          # значение не должно превышать limit
    check_on: hi            # проверяем по ВЕРХНЕЙ границе интервала, не по mean
    source: spec
    comment: "Товарное ДТ, минимальная жёсткая проверка из ТЗ"

  flash_c:
    limit: 55.0
    direction: min
    check_on: lo
    source: assumption
    comment: "Модельное допущение. В ЛИМС наблюдается 35..92, медиана 68."

  cfpp_c:
    limit: 0.0
    direction: max
    check_on: hi
    source: assumption
    comment: "Летний сорт. Модельное допущение, сезонность не учтена."

  d15_kgm3:
    limit: 845.0
    direction: max
    check_on: hi
    source: assumption
    comment: "Модельное допущение. В ЛИМС 821.6..856.2."

# ============================================================================
# УПРАВЛЯЕМЫЕ ПЕРЕМЕННЫЕ
# ============================================================================
# Отбор шести переменных обоснован тремя независимыми источниками сразу:
#
#   (1) СХЕМА. Рукописные коды на листах АВТ. Синие и зелёные кольца по
#       легенде = управляемые переменные.
#   (2) ЛИТЕРАТУРА. Опубликованный проект APC для ЭЛОУ-АВТ (Газпром
#       нефтехим Салават, Honeywell Profit Controller) перечисляет в
#       качестве ключевых управляющих переменных атмосферной колонны:
#       температуры верха, расходы циркуляционных орошений, температуру
#       выхода печи, расходы продуктов и пара в стриппинги; давления
#       верха включены как вспомогательные управляющие.
#   (3) ДАННЫЕ. Корреляция с конечной точкой кипения (EBP) дизельной
#       фракции, идущей в гидроочистку, по ЛИМС точки отбора 1
#       гидроочистки, n=1260, после отсечения простоев и маркеров 307.0.
#
# ДИАПАЗОНЫ: 5-й и 95-й перцентиль по истории 2023-2026 после отсечения
# 3.5% строк простоя установки (11 эпизодов, самый длинный 486 ч) и
# значений-маркеров 307.0. Это НЕ промышленные пределы, а модельные
# границы рабочей области, поэтому source: assumption.
#
# MAX_STEP: 90-й перцентиль модуля фактического изменения параметра за
# час, то есть система не предлагает движений крупнее тех, что оператор
# делает сам. Это защита от экстраполяции модели за пределы данных.
# ============================================================================

manipulated_vars:
  "242000:T5":
    name: "Температура ГСС на выходе Р-201 (прокси входа в реактор)"
    units: "degC"
    range: [340.0, 375.0]
    max_step: 2.0            # максимальный шаг за один цикл рекомендации
    source: assumption

  "AVT:F30":
    name: "Расход фр.290-350 с установки (отбор дизельной фракции)"
    units: "t/h"
    range: [40.0, 75.0]
    max_step: 3.0
    source: assumption

  "AVT:T33":
    name: "Температура низа К-2"
    units: "degC"
    range: [330.0, 365.0]
    max_step: 2.0
    source: assumption

# Правила отказа от рекомендации
# Целевой запас по жёстким ограничениям.
# Если текущий режим уже даёт запас >= target_margin, система НЕ должна
# выдавать управляющее воздействие: ТЗ прямо требует показать период,
# где лишних действий не создаётся.
decision:
  target_margin:
    sulfur_mgkg: 0.5        # мг/кг
  action_deadband: 0.05     # изменения меньше этой доли max_step считаем нулевыми

refusal_rules:
  max_lims_age_min: 1440      # ЛИМС старше суток -> не факт о текущем продукте
  min_confidence: 0.35        # ниже -> система отказывается рекомендовать
  require_healthy_pak: false  # при мёртвом ПАК работаем, но снижаем confidence

# Блендинг
blending:
  components_sum: 1.0
  tolerance: 1e-6
